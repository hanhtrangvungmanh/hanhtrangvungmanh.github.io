<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hành Trang Vững Mạnh - Vinh Glory</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 antialiased min-h-screen flex flex-col md:flex-row overflow-x-hidden">

    <!-- Vùng nhúng Sidebar từ sidebar.html -->
    <div id="sidebar-container" class="flex flex-col md:flex-row shrink-0"></div>

    <!-- Right Main Content Area -->
    <main class="flex-1 overflow-y-auto h-[calc(100vh-61px)] md:h-screen p-6 sm:p-10 md:p-12">
        <div class="max-w-4xl mx-auto space-y-6">
            <div class="bg-white dark:bg-slate-800 p-8 sm:p-10 rounded-3xl border border-slate-100 dark:border-slate-700/50 shadow-sm transition-all hover:shadow-md">
                <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-slate-900 dark:text-white tracking-tight mb-4 bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
                    Hành Trang Vững Mạnh - Vinh Glory
                </h1>
                <p class="text-lg sm:text-xl text-slate-600 dark:text-slate-300 leading-relaxed font-normal">
                    Vinh - Glory - 1976 - 0948.72.99.74 - Viet Nam.
                </p>
            </div>
        </div>
    </main>

    <!-- Nhúng duy nhất 1 file script -->
    <script src="sidebar.js"></script>
</body>
</html>
